<!-- Task 4: SMS Character Counter -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SMS Character Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Send a Notice by SMS</h1>
    <label for="message">Message</label>
    <textarea id="message" rows="3"></textarea>
    <p id="counter">160 characters left</p>
    <p>Preview: <em id="preview"></em></p>
  </div>
  <script src="task4.js"></script>
</body>
</html>
