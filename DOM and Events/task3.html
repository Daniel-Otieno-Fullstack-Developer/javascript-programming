<!-- Task 3: Gate Counter -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gate Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Main Gate Counter</h1>
    <p>People inside the college: <strong id="inside">0</strong></p>
    <p id="status">The gate is quiet.</p>
    <button id="enter">+ Enter</button>
    <button id="leave">- Leave</button>
    <button id="reset">Reset</button>
  </div>
  <script src="task3.js"></script>
</body>
</html>
