<!-- Task 5: Fare Calculator -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fare Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Matatu Fare Calculator</h1>
    <label for="stage">Destination</label>
    <select id="stage">
      <option value="60">Pangani - KES 60</option>
      <option value="80">Muthaiga - KES 80</option>
      <option value="100">Kasarani - KES 100</option>
      <option value="120">Ruiru - KES 120</option>
    </select>
    <label for="people">Number of passengers</label>
    <input id="people" type="number" value="1">
    <label><input id="student" type="checkbox" style="width:auto"> Student with ID
      (KES 20 off each)</label>
    <button id="calculate">Calculate fare</button>
    <div class="result" id="result"></div>
  </div>
  <script src="task5.js"></script>
</body>
</html>
