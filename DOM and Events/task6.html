<!-- Task 6: Grade Checker Form -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grade Checker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Grade Checker</h1>
    <form id="grade-form">
      <label for="name">Student name</label>
      <input id="name" type="text">
      <label for="mark">Mark (0-100)</label>
      <input id="mark" type="text">
      <button type="submit">Check grade</button>
    </form>
    <div class="result" id="result"></div>
  </div>
  <script src="task6.js"></script>
</body>
</html>
